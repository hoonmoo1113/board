<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E83A78">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="내기 한판">
<title>친구와의 즐거운 내기 한판</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  :root{--bg:#f3f2ec;--card:#fff;--soft:#faf9f5;--ink:#20233a;--muted:#6b7189;--line:#1f233826;--gold:#C98A00;--teal:#0C8FB8;--violet:#5B45E0;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;letter-spacing:-.01em}
  .app{max-width:1000px;margin:0 auto;padding:0 12px 120px}
  .top{position:sticky;top:0;z-index:30;backdrop-filter:blur(12px);background:#f3f2ece6;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 4px}
  .brand{font-weight:900;font-size:18px;letter-spacing:-.02em;background:linear-gradient(92deg,var(--gold),#DB2777 55%,var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
  .btn{border:0;cursor:pointer;font-weight:800;font-size:14px;padding:10px 14px;border-radius:11px;color:#3a2c00;background:linear-gradient(92deg,#FFD23F,#FFB020)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.small{padding:7px 11px;font-size:13px;border-radius:9px}
  .btn.teal{background:linear-gradient(92deg,var(--violet),var(--teal));color:#fff}.btn.danger{background:#EF4444;color:#fff}.btn.green{background:#1E9E52;color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
  h2.sec{font-size:14px;margin:0 0 10px;font-weight:800}
  .turnbar{position:sticky;top:52px;z-index:25;font-size:18px;border-radius:0 0 14px 14px;padding:14px;font-weight:800;text-align:center;color:#fff;box-shadow:0 8px 20px -14px #0006}
  .turnbar.wait{background:#ecebe4;color:var(--muted)}.turnbar.done{background:#1E9E52;color:#fff}.turnbar.mine{background:linear-gradient(92deg,#1E9E52,#0C8FB8)}
  .prog{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
  .prog .pg{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-weight:600}
  .prog .pg b{color:var(--ink);font-weight:800}
  .prog .pg.cur{border-color:#E6A700;background:#FFF7DC;color:#7a5a00}
  .prog .pg.cur b{color:#7a5a00}
  .prog .pg.done{background:#EAF8EE;border-color:#1E9E5233;color:#157a3f}
  .prog .pg.done b{color:#157a3f}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
  .tab{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--muted);font-weight:800;font-size:15px;padding:10px 14px;border-radius:12px 12px 0 0;cursor:pointer;white-space:nowrap}
  .tab.add{background:var(--soft);color:var(--teal)} .tab .tmove{color:#5a4a00;font-weight:900;font-size:13px;padding:0 3px;border-radius:5px}
  .tbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid #cbb96a}
  table.board{border-collapse:collapse;width:100%;background:#fff;--tt:#FCE9A6;--th:#FBF3CE;--te:#d9c98b}
  table.board td{border:1px solid var(--te);padding:9px 8px;text-align:center;font-size:15px;font-weight:600}
  table.board td.title{background:var(--tt);font-weight:900;font-size:18px;padding:11px}
  table.board td.head{background:var(--th);font-weight:800}
  table.board td.grp{background:#fffdf3;font-weight:800;font-size:15px;white-space:normal;word-break:keep-all;line-height:1.25;width:64px;min-width:56px;max-width:78px;padding:8px 4px}
  table.board td.lbl{background:#fffdf3;font-weight:700;white-space:nowrap;padding:9px 10px}
  @media(max-width:520px){
    table.board td{font-size:14px;padding:8px 6px}
    table.board td.grp{font-size:13.5px;width:52px;min-width:48px;padding:8px 3px}
    table.board td.lbl{font-size:13.5px;padding:8px 7px}
    table.board td.ans{min-width:78px}
    table.board td.strikebtn{width:32px}
    .sbtn{padding:5px 6px;font-size:13px}
  }
  table.board td.ans{min-width:100px;height:50px;color:#333}
  table.board td.ans.pick{cursor:pointer;background:#f4f6ff}
  table.board td.ans.pick:active{background:#dfe6ff}
  table.board td.ans .nm{font-weight:800;font-size:14px}
  table.board td.cstruck{filter:grayscale(1) opacity(.5);position:relative}
  table.board td.cstruck::after{content:'';position:absolute;left:4px;right:4px;top:50%;height:3px;background:#e11d48;box-shadow:0 0 0 1px #ffffffaa;transform:translateY(-50%);pointer-events:none}
  table.board td.ans{position:relative}
  .cellx{position:absolute;top:2px;right:2px;width:20px;height:20px;line-height:1;border-radius:6px;border:1px solid var(--line);
    background:#fff;color:#c7ccd8;font-size:12px;font-weight:900;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;z-index:2}
  .cellx:hover{color:#e11d48;border-color:#e0999955;background:#fdeaea}
  .cellx.on{color:#fff;background:#e11d48;border-color:#e11d48}
  @media(max-width:520px){.cellx{width:18px;height:18px;font-size:11px}}
  .smodebar{background:#fdeaea;border:1px solid #e0999955;color:#b13636;border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:700;margin:8px 0;text-align:center}
  table.board td.win{outline:3px solid #E6A700;outline-offset:-3px;background:#FFF7DC !important;filter:none !important;position:relative}
  table.board td.win::before{content:'🏆';position:absolute;left:4px;top:2px;font-size:13px}
  table.board tr.struck td.win{filter:none !important;opacity:1 !important}
  table.board tr.struck td.win::after{display:none}
  .resultbar{border-radius:12px;padding:12px 14px;margin:8px 0;font-weight:800;text-align:center;font-size:16px}
  .resultbar.win{background:linear-gradient(92deg,#FFD23F,#FFB020);color:#3a2c00}
  .resultbar.draw{background:#E7ECF5;color:#39415c}
  .resultbar.cancel{background:#EFEFEA;color:#6b7189}
  .rescore{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .rescore .s{display:flex;align-items:center;gap:7px;background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:7px 12px;font-weight:800;font-size:14px}
  .rescore .s.top{border-color:#E6A700;background:#FFF7DC}
  .rescore .s .n{font-weight:900;color:#C98A00}
  .pickmode{background:#fff7dc;border:1px solid #E6A70055;color:#7a5a00;border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:700;margin:8px 0;text-align:center}
  table.board td.ph{background:#f6f6f2;color:#b7b7ad;font-size:12px;font-weight:600}
  table.board tr.struck td:not(.grp):not(.strikebtn){filter:grayscale(1) opacity(.55);position:relative}
  table.board tr.struck td:not(.grp):not(.strikebtn)::after{content:'';position:absolute;left:0;right:0;top:50%;height:3px;background:#e11d48;box-shadow:0 0 0 1px #ffffffaa;transform:translateY(-50%);pointer-events:none}
  table.board td.lbl .xmark{color:#e11d48;font-weight:900;margin-left:6px;font-size:12px}
  table.board td.strikebtn{background:#fff;border:none;padding:0 4px;width:38px}
  .sbtn{border:1px solid var(--line);background:#fff;border-radius:8px;font-size:14px;font-weight:900;padding:6px 8px;cursor:pointer;color:#b0b4c4;line-height:1}
  .sbtn.on{background:#fdeaea;border-color:#e0999955;color:#e11d48}
  table.board.edit td{padding:5px}
  table.board.edit input{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px;font-size:14px;font-weight:700;background:#fff;text-align:center}
  .mini{padding:6px 12px;font-size:13px;font-weight:800;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink);margin-top:6px}
  .mini.add{background:#e1f4fb;border-color:#0C8FB855;color:var(--teal)}.mini.del{background:#fdeaea;border-color:#e0999955;color:#c0392b}
  .players{display:flex;flex-wrap:wrap;gap:8px}
  .pchip{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:800;background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:8px 13px}
  .pchip.cur{border-color:var(--violet);box-shadow:0 0 0 2px #5b45e022;background:#f3f0ff}.pchip.me{outline:2px solid #1E9E52}
  .pchip .dot{width:12px;height:12px;border-radius:50%}.pchip .ord{color:var(--muted);font-weight:900;margin-left:2px;font-size:12px;padding:0 2px;cursor:pointer}.pchip .x{color:#c0392b;font-weight:900;margin-left:4px;cursor:pointer}
  /* 방장 참가자 목록: 순서 버튼(▲▼)은 크게, 삭제는 오른쪽 끝에 멀리 분리 */
  .players.host{flex-direction:column}
  .players.host .pchip{width:100%;border-radius:14px;padding:8px 10px;gap:8px}
  .pchip .pname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pchip .mvgrp{display:flex;gap:8px}
  .pchip .mv{width:44px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:16px;font-weight:900;color:var(--ink);cursor:pointer;padding:0}
  .pchip .mv:active{background:#e8e6ff}.pchip .mv:disabled{opacity:.3}
  .pchip .delgrp{margin-left:26px;padding-left:14px;border-left:2px dashed #e0999977}
  .pchip .pdel{height:32px;padding:0 10px;border-radius:8px;border:1px solid #e0999966;background:#fff;color:#c0392b;font-size:12px;font-weight:800;cursor:pointer}
  .hostfillbar{background:#eef4ff;border:1px solid #c9d6f5;color:#2b3a67;border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:700;margin:8px 0;text-align:center;line-height:1.5}
  table.board td.ans.fillable{cursor:pointer;outline:2px dashed #5B45E066;outline-offset:-3px}
  table.board td.ans.fillable .cellx{display:none}
  .orphanbox{background:#fff7dc;border:1px solid #E6A70066;border-radius:12px;padding:12px;margin-bottom:12px;font-size:13.5px;font-weight:700;color:#7a5a00}
  .orphanbox .orow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
  .orphanbox select{padding:8px;border-radius:8px;border:1px solid var(--line);font-size:14px;font-weight:700;background:#fff}
  .pickmask{position:fixed;inset:0;background:#0007;z-index:100;display:flex;align-items:flex-end;justify-content:center}
  .picksheet{background:#fff;width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
  .picksheet h3{margin:0 0 4px;font-size:16px}.picksheet .sub{font-size:12.5px;color:var(--muted);margin-bottom:10px}
  .picksheet .popt{display:flex;align-items:center;gap:10px;width:100%;padding:13px 12px;margin-bottom:8px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px;font-weight:800;cursor:pointer;text-align:left}
  .picksheet .popt .dot{width:14px;height:14px;border-radius:50%}
  .picksheet .popt.cur{border-color:#5B45E0;background:#f3f0ff}
  .ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .ti{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:11px 12px;font-size:15px;font-weight:600}
  .num{width:60px;text-align:center}
  .row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  details{border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:12px}
  summary{cursor:pointer;font-weight:800;font-size:14px;padding:14px;list-style:none}summary::-webkit-details-marker{display:none} .dbody{padding:14px}
  .pininput{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:11px;color:var(--ink);padding:13px;font-size:17px;text-align:center;letter-spacing:5px;margin-bottom:10px}
  .nameinput{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:14px;font-size:17px;font-weight:700;margin-bottom:12px}
  .qr{background:#fff;padding:10px;border-radius:12px;width:150px;height:150px;display:flex;align-items:center;justify-content:center;margin:0 auto;border:1px solid var(--line)}
  .linkline{word-break:break-all;font-size:12px;color:var(--teal);background:var(--soft);padding:8px 10px;border-radius:8px;border:1px solid var(--line);margin-top:10px;text-align:center}
  .note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px}
  .hint{font-size:13px;color:var(--muted);margin:6px 2px 12px}
  .foot{text-align:center;margin-top:12px}.link{color:var(--muted);font-size:12px;text-decoration:underline;background:none;border:0;cursor:pointer}
  .hidden{display:none}
  .whoami{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">친구와의 즐거운 내기 한판</div><div id="topRight"></div></div>
  <div id="connbar"></div>

  <!-- 이름 입력(참여) -->
  <div id="nameGate" class="hidden">
    <div class="card" style="max-width:400px;margin:24px auto"><h2 class="sec">내 이름으로 참여</h2>
      <p class="note" style="margin-top:0">이름을 넣고 참여하면 내 색이 지정됩니다. 내 차례에만 빈칸을 채울 수 있어요. <b>쓰던 이름을 똑같이</b> 넣으면 폰·컴퓨터·태블릿 어디서든 같은 사람으로 이어서 참여됩니다.</p>
      <input class="nameinput" id="nameInput" maxlength="16" placeholder="이름 (예: 홍길동)">
      <button class="btn green" style="width:100%" onclick="join()">참여하기</button>
      <button class="btn ghost" style="width:100%;margin-top:8px" onclick="enableNotify()" id="notifyBtn">🔔 내 차례 알림 켜기</button>
      <p class="note" id="joinErr" style="color:#b13636"></p>
    </div>
    <div class="foot"><button class="link" onclick="goHost()">방장 화면</button></div>
  </div>

  <!-- 친구(참가자) 화면 -->
  <div id="play" class="hidden">
    <div class="turnbar wait" id="turnbar"></div><div class="prog" id="prog"></div>
    <div id="notifyRow" style="text-align:center;margin:4px 0 10px"></div>
    <div id="resultBox"></div>
    <div class="tabs" id="tabs"></div>
    <div class="tablewrap"><table class="board" id="board"></table></div>
    <p class="hint" id="tableHint"></p>
    <div class="card"><h2 class="sec">참가자 순번</h2><div class="players" id="players"></div></div>
    <div class="foot"><button class="link" onclick="changeName()">이름 변경</button> · <button class="link" onclick="goHost()">방장 화면</button></div>
  </div>

  <!-- 방장 화면 -->
  <div id="host" class="hidden">
    <div id="pinGate"><div class="card" style="max-width:360px;margin:24px auto"><h2 class="sec">방장 확인</h2>
      <input class="pininput" id="pinInput" inputmode="numeric" placeholder="••••">
      <button class="btn" style="width:100%" onclick="checkPin()">확인</button>
      <button class="btn ghost" style="width:100%;margin-top:8px" onclick="exitHost()">뒤로</button>
      <p class="note" id="pinErr" style="color:#b13636"></p></div></div>
    <div id="hostMain" class="hidden">
      <div class="turnbar wait" id="turnbarH"></div><div class="prog" id="progH"></div>
      <div class="row2" style="justify-content:flex-end;margin-bottom:8px"><button class="btn ghost small" id="editToggle" onclick="toggleEdit()">✏️ 표 수정하기</button><button class="btn ghost small" onclick="renameBoard()">✎ 이름</button><button class="btn ghost small" onclick="deleteBoard()">🗑 삭제</button><button class="btn ghost small" onclick="exitHost()">친구 화면</button></div>
      <div class="tabs" id="tabsH"></div>
      <div class="tbar" id="tbar"></div>
      <div class="row2" style="margin-bottom:6px"><button class="btn ghost small" id="fillBtn" onclick="toggleHostFill()">🖊 방장 칸 채우기</button></div><div id="fillBar"></div>
      <div class="tablewrap"><table class="board" id="boardH"></table></div>
      <p class="hint" id="tableHintH"></p>
      <div id="resultBoxH"></div>

      <div class="card"><h2 class="sec">진행 제어</h2><div class="ctrl">
        <button class="btn green small" id="startBtn" onclick="startGame()">▶ 시작</button>
        <button class="btn ghost small" id="stopBtn" onclick="stopGame()">⏸ 중단(참여 다시 열기)</button>
        <button class="btn ghost small" onclick="undo()">◀ 되돌리기</button>
        <button class="btn ghost small" onclick="passTurn()">다음 차례 ▶</button>
        <span class="note" style="margin:0">한 번에</span><input class="ti num" id="ppt" type="number" min="1" value="1" onchange="setPPT()"><span class="note" style="margin:0">칸씩</span>
        <button class="btn ghost small" onclick="clearBoard()" style="margin-left:auto">이 판 비우기</button>
      </div></div>
      <div id="orphanBox"></div>
      <div class="card"><h2 class="sec">참가자 <span class="note" style="font-weight:500">· 친구들이 접속하면 여기에 나타납니다 · ▲▼ 순서 변경 · 삭제는 오른쪽 끝(확인창이 뜹니다)</span></h2>
        <div class="players" id="playersH"></div>
        <div class="row2" style="margin-top:10px"><input class="ti" id="addP" maxlength="16" placeholder="직접 참가자 추가(선택)"><button class="btn ghost small" onclick="hostAddPlayer()">추가</button></div></div>
      <details><summary>📱 친구 접속 QR/링크 · 비밀번호 · 초기화</summary><div class="dbody">
        <div class="qr" id="qr"></div><div class="linkline" id="linkline"></div>
        <p class="note">이 링크(또는 QR)를 친구들에게 보내세요. 친구가 열면 이름을 넣고 참여합니다.</p>
        <hr style="border:none;border-top:1px solid var(--line);margin:12px 0">
        <input class="pininput" id="newPin" inputmode="numeric" placeholder="새 방장 비밀번호(4자리+)"><button class="btn ghost small" onclick="changePin()">비밀번호 변경</button><span class="note" id="pinMsg"></span>
        <hr style="border:none;border-top:1px solid var(--line);margin:12px 0">
        <button class="btn danger small" onclick="resetAll()">전체 초기화 (모든 판 비우기)</button>
      </div></details>
    </div>
  </div>
</div>

<script>
var THEMES=[{t:'#FCE9A6',h:'#FBF3CE',e:'#cbb96a'},{t:'#CFE8FB',h:'#E7F4FC',e:'#7fbfe6'},{t:'#D5F0DC',h:'#EAF8EE',e:'#84cfa0'},{t:'#FAD9E7',h:'#FCEAF1',e:'#e39ac0'},{t:'#E5DBFB',h:'#F1ECFC',e:'#ad97e6'},{t:'#FBE3CE',h:'#FCEFE2',e:'#e6b184'},{t:'#D6F2F0',h:'#E8F8F7',e:'#84d2cc'}];
function theme(b){return THEMES[((b&&b.themeIdx)||0)%THEMES.length];}
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function tint(c){return c+'26';}
async function api(p,b){var o={headers:{'Content-Type':'application/json'}};if(b){o.method='POST';o.body=JSON.stringify(b);}try{return await (await fetch(p,o)).json();}catch(e){return {error:'net'};}}
function hpin(){return localStorage.getItem('fb_pin')||'';}
async function apiH(p,b){var r=await api(p,Object.assign({pin:hpin()},b||{}));if(r&&r.error==='pin'){localStorage.removeItem('fb_pin');alert('방장 비밀번호를 다시 입력해 주세요.');render();}return r;}

var ST={boards:[],players:[],turn:{curIdx:0,remaining:1,picksPerTurn:1,started:false},claims:{},strikes:{},cellStrikes:{},results:{}};
var pickWinMode=false, strikeMode=false, hostFillMode=false; // strikeMode: 더 이상 사용하지 않음(각 칸 ✕ 버튼으로 대체)
var role=localStorage.getItem('fb_role')||'player';
var myId=localStorage.getItem('fb_pid'); if(!myId){myId=(window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2));localStorage.setItem('fb_pid',myId);}
var myName=localStorage.getItem('fb_name')||'';
var sel=localStorage.getItem('fb_sel')||'';
var editing=false,draft=null,connErr='';

function board(){for(var i=0;i<ST.boards.length;i++)if(ST.boards[i].id===sel)return ST.boards[i];return ST.boards[0];}
function bturn(){var b=board(); if(b&&b.turn&&typeof b.turn==='object'){ if(typeof b.turn.remaining!=='number')b.turn.remaining=b.turn.picksPerTurn||1; if(typeof b.turn.curIdx!=='number')b.turn.curIdx=0; if(typeof b.turn.picksPerTurn!=='number')b.turn.picksPerTurn=1; return b.turn; } return ST.turn||{curIdx:0,remaining:1,picksPerTurn:1,started:false};}
function curPlayer(){var t=bturn();return ST.players.length?ST.players[t.curIdx%ST.players.length]:null;}
function meIsCurrent(){var c=curPlayer();return bturn().started&&c&&c.id===myId;}
function findPlayer(id){for(var i=0;i<ST.players.length;i++)if(ST.players[i].id===id)return ST.players[i];return null;}
function groupRuns(rows){var info=rows.map(function(){return {start:false,span:1,grouped:false};});for(var i=0;i<rows.length;i++){var g=rows[i].group||'';if(!g)continue;info[i].grouped=true;if(i>0&&(rows[i-1].group||'')===g){info[i].start=false;}else{info[i].start=true;var j=i,s=0;while(j<rows.length&&(rows[j].group||'')===g){s++;j++;}info[i].span=s;}}return info;}
function progress(){var tot=0,done=0;ST.boards.forEach(function(b){tot+=b.config.rows.length*b.config.answerCols.length;done+=Object.keys(ST.claims[b.id]||{}).length;});return {tot:tot,done:done};}
function boardProgress(b){var tot=b.config.rows.length*b.config.answerCols.length,done=Object.keys(ST.claims[b.id]||{}).length;return {tot:tot,done:done,left:Math.max(0,tot-done)};}
function progHTML(){
  var b=board(); if(!b) return '';
  var bp=boardProgress(b);
  var txt=bp.left>0?('남은 칸 <b>'+bp.left+'칸</b> <span style="opacity:.7">('+bp.done+'/'+bp.tot+' 채움)</span>'):'<b>이 판 완료 ✓</b>';
  return '<span class="pg'+(bp.left===0?' done':' cur')+'">'+esc(b.name)+' · '+txt+'</span>';
}

// ---------- shared renderers ----------
function renderTabs(elId,hostMode){var t=$(elId);if(!t)return;t.innerHTML='';
  ST.boards.forEach(function(b,idx){var d=document.createElement('span');d.className='tab'+(b.id===sel?' on':'');var th=theme(b);d.style.borderLeft='6px solid '+th.e;if(b.id===sel){d.style.background=th.t;d.style.borderColor=th.e;d.style.color='#3a2c00';}
    var mv=(hostMode&&b.id===sel&&ST.boards.length>1)?'<span class="tmove" onclick="event.stopPropagation();moveBoard('+idx+',-1)">◀</span>':'';
    var mv2=(hostMode&&b.id===sel&&ST.boards.length>1)?'<span class="tmove" onclick="event.stopPropagation();moveBoard('+idx+',1)">▶</span>':'';
    var st2=(b.turn&&b.turn.started)?'<span style="color:#1E9E52;font-size:11px">●</span> ':'<span style="color:#b9bdc9;font-size:11px">●</span> ';
    d.innerHTML=mv+st2+'<span>'+esc(b.name)+'</span>'+mv2;
    d.onclick=function(){if(hostMode&&editing&&!confirm('편집 중입니다. 저장하지 않고 이동할까요?'))return;editing=false;if(hostMode)$('editToggle').textContent='✏️ 표 수정하기';sel=b.id;localStorage.setItem('fb_sel',sel);render();};
    t.appendChild(d);});
  if(hostMode){var a=document.createElement('button');a.className='tab add';a.textContent='＋ 판 추가';a.onclick=addBoard;t.appendChild(a);
    var cp=document.createElement('button');cp.className='tab add';cp.textContent='⧉ 이 판 복제';cp.onclick=duplicateBoard;t.appendChild(cp);}}
function turnHTML(forMe){var p=progress();
  if(!ST.players.length)return {c:'wait',x:'참가자를 기다리는 중…'};
  if(!bturn().started)return {c:'wait',x:(board()?('⏸ '+board().name+' — 대기 중 (방장이 시작하면 진행)'):'곧 시작합니다…')};
  var _bp=board()?boardProgress(board()):{tot:0,left:0}; if(_bp.tot>0&&_bp.left===0)return {c:'done',x:'🎉 이 판은 모두 채워졌습니다 — 결과 완성!'};
  var cur=curPlayer();
  if(forMe&&cur.id===myId)return {c:'mine',x:'🟢 내 차례! 빈칸을 누르세요 (남은 '+bturn().remaining+'칸)',bg:''};
  return {c:'',x:'지금 차례: '+cur.name+'  ·  남은 '+bturn().remaining+'칸',bg:cur.color};}
function paintTurn(elId,progId,forMe){var o=turnHTML(forMe);var tb=$(elId);tb.className='turnbar '+o.c;tb.style.background=o.bg||'';tb.textContent=o.x;$(progId).innerHTML=progHTML();}
function renderPlayers(elId,hostMode){var w=$(elId);if(!w)return;
  w.className='players'+(hostMode?' host':'');
  w.innerHTML=ST.players.map(function(p,i){var _t=bturn(); var cls='pchip'+(i===_t.curIdx&&_t.started?' cur':'')+(p.id===myId?' me':'');
    var ctl=hostMode?('<span class="mvgrp"><button class="mv" '+(i===0?'disabled ':'')+'onclick="event.stopPropagation();movePlayer('+i+',-1)" aria-label="위로">▲</button><button class="mv" '+(i===ST.players.length-1?'disabled ':'')+'onclick="event.stopPropagation();movePlayer('+i+',1)" aria-label="아래로">▼</button></span><span class="delgrp"><button class="pdel" onclick="event.stopPropagation();removePlayer('+i+')">삭제</button></span>'):'';
    return '<span class="'+cls+'"><span class="dot" style="background:'+p.color+'"></span><span class="pname">'+(i+1)+'. '+esc(p.name)+(p.id===myId?' <b style="color:#1E9E52">(나)</b>':'')+'</span>'+ctl+'</span>';}).join('')||'<span class="note">아직 참가자가 없습니다.'+(hostMode?' 친구가 접속하거나 직접 추가하세요.':' 참여하면 여기에 표시됩니다.')+'</span>';}
function renderBoardInto(elId,hintId,interactive){var b=board();var t=$(elId);t.className='board';if(!b){t.innerHTML='';return;}var th=theme(b);t.style.setProperty('--tt',th.t);t.style.setProperty('--th',th.h);t.style.setProperty('--te',th.e);if(t.parentElement)t.parentElement.style.borderColor=th.e;
  var c=b.config,AC=c.answerCols.length,total=2+AC+1,claims=ST.claims[b.id]||{};var canPick=interactive&&meIsCurrent();
  var h='';(c.title||[]).forEach(function(l){h+='<tr><td class="title" colspan="'+total+'">'+esc(l)+'</td></tr>';});
  h+='<tr><td class="head" colspan="2">'+esc(c.labelHeader||'')+'</td>'+c.answerCols.map(function(a){return '<td class="head">'+esc(a)+'</td>';}).join('')+'<td class="head" style="font-size:11px;color:#8a8f9f">탈락</td></tr>';
  var info=groupRuns(c.rows);
  var sm=(ST.strikes&&ST.strikes[b.id])||{}; var csm=(ST.cellStrikes&&ST.cellStrikes[b.id])||{}; var res=(ST.results&&ST.results[b.id])||null;
  c.rows.forEach(function(row,ri){var st=!!sm[ri];h+='<tr class="'+(st?'struck':'')+'">';
    if(info[ri].grouped){if(info[ri].start)h+='<td class="grp" rowspan="'+info[ri].span+'">'+esc(row.group)+'</td>';h+='<td class="lbl">'+esc(row.label)+(st?'<span class="xmark">✕</span>':'')+'</td>';}
    else h+='<td class="lbl" colspan="2">'+esc(row.label)+(st?'<span class="xmark">✕</span>':'')+'</td>';
    for(var a=0;a<AC;a++){var cell=ri+'_'+a,owner=claims[cell];
      var isWin=(res&&res.kind==='win'&&res.cell===cell); var cst=!!csm[cell]; var cx=(cst?' cstruck':'')+(strikeMode?' smode':'');
      if(owner){var pl=findPlayer(owner),col=pl?pl.color:'#888';h+='<td class="ans'+(isWin?' win':'')+cx+'" data-c="'+cell+'" style="background:'+tint(col)+';border-left:4px solid '+col+'"><button class="cellx'+(cst?' on':'')+'" data-x="'+cell+'" title="이 칸만 탈락 표시/해제">✕</button><span class="nm" style="color:'+col+'">'+(pl?esc(pl.name):'?')+'</span></td>';}
      else h+='<td class="ans'+(canPick?' pick':'')+(isWin?' win':'')+cx+'" data-c="'+cell+'"><button class="cellx'+(cst?' on':'')+'" data-x="'+cell+'" title="이 칸만 탈락 표시/해제">✕</button></td>';}
    h+='<td class="strikebtn"><button class="sbtn'+(st?' on':'')+'" data-r="'+ri+'" title="결과 아님(탈락) 표시">✕</button></td>';
    h+='</tr>';});
  t.innerHTML=h;
  if(hostFillMode&&!interactive&&!pickWinMode){var fc=t.querySelectorAll('td.ans');for(var fi=0;fi<fc.length;fi++)fc[fi].classList.add('fillable');}
  if(interactive||pickWinMode||strikeMode||(hostFillMode&&!interactive)){var cells=t.querySelectorAll('td.ans');for(var k=0;k<cells.length;k++){(function(td){td.onclick=function(){onCellPlayer(td.getAttribute('data-c'));};})(cells[k]);}}
  var sbs=t.querySelectorAll('button.sbtn');for(var q=0;q<sbs.length;q++){(function(bt){bt.onclick=function(ev){ev.stopPropagation();toggleStrike(+bt.getAttribute('data-r'));};})(sbs[q]);}
  var cxs=t.querySelectorAll('button.cellx');for(var z=0;z<cxs.length;z++){(function(bt){bt.onclick=function(ev){ev.stopPropagation();toggleCellStrike(bt.getAttribute('data-x'));};})(cxs[z]);}
  if(hintId)$(hintId).textContent=canPick?'지금 내 차례! 빈칸을 누르면 내 이름으로 채워집니다.':(interactive?'다른 사람 차례입니다. 잠시 기다려 주세요.':'');}

// ---------- player ----------
async function join(){var v=($('nameInput').value||'').trim();if(!v)return;var r=await api('/api/join',{id:myId,name:v});
  if(r.ok){ if(r.id && r.id!==myId){ myId=r.id; localStorage.setItem('fb_pid',myId); }
    myName=v;localStorage.setItem('fb_name',myName);
    if(r.rejoined){ try{ if(notifyOn) subscribePush(true); }catch(e){} }
    render();return;}
  if(r.error==='started'){
    var ns=(r.names&&r.names.length)?r.names.join(', '):'';
    $('joinErr').innerHTML='이미 시작된 게임입니다. <b>쓰던 이름을 똑같이 입력</b>하면 그대로 이어서 들어옵니다.'+
      (ns?'<br>현재 참가자: <b>'+esc(ns)+'</b>':'')+'<br>새 이름으로 참여하려면 방장이 <b>⏸ 중단(참여 다시 열기)</b>을 눌러야 합니다.';
  } else $('joinErr').textContent='참여 실패';}
function changeName(){myName='';localStorage.removeItem('fb_name');render();}
function winnerName(bid){var r=(ST.results||{})[bid]; if(!r||r.kind!=='win')return null; var o=((ST.claims[bid]||{})[r.cell]); var p=findPlayer(o); return p?p.name:null; }
function renderResult(boxId){
  var box=$(boxId||'resultBox'); if(!box) return; var b=board(); if(!b){box.innerHTML='';return;}
  var r=(ST.results||{})[b.id]; var html='';
  if(pickWinMode) html+='<div class="pickmode">🏆 실제 결과가 나온 칸(이름이 적힌 칸)을 눌러 주세요 &nbsp;<button class="btn ghost small" onclick="cancelPickWin()">취소</button></div>';
  if(r){
    if(r.kind==='win'){ var nm=winnerName(b.id); html+='<div class="resultbar win">🏆 이번 판 승자 — '+esc(nm||'(이름 없음)')+'</div>'; }
    else if(r.kind==='draw') html+='<div class="resultbar draw">🤝 무승부 — 승자 없음</div>';
    else if(r.kind==='cancel') html+='<div class="resultbar cancel">🚫 경기 취소(없던 경기) — 무효</div>';
  }
  html+='<div class="row2" style="justify-content:center;margin:6px 0 2px">'+
    (r?'<button class="btn ghost small" onclick="setResult(\'none\')">결과 지우기</button>':
        '<button class="btn small" onclick="startPickWin()">🏆 결과 칸 지정</button><button class="btn ghost small" onclick="setResult(\'draw\')">🤝 무승부</button><button class="btn ghost small" onclick="setResult(\'cancel\')">🚫 경기 취소</button>')+
    '</div>';
  // overall tally across boards
  var tally={},any=false;
  ST.boards.forEach(function(bd){ var nm=winnerName(bd.id); if(nm){ tally[nm]=(tally[nm]||0)+1; any=true; } });
  if(any){ var arr=Object.keys(tally).map(function(k){return {n:k,v:tally[k]};}).sort(function(a,b){return b.v-a.v;}); var mx=arr[0].v;
    html+='<div class="rescore">'+arr.map(function(x){var p=ST.players.filter(function(pp){return pp.name===x.n;})[0];
      return '<span class="s'+(x.v===mx?' top':'')+'">'+(p?'<span class="dot" style="width:11px;height:11px;border-radius:50%;background:'+p.color+'"></span>':'')+esc(x.n)+' <span class="n">'+x.v+'승</span></span>';}).join('')+'</div>';
  }
  box.innerHTML=html;
}
function toggleStrikeMode(){ strikeMode=!strikeMode; if(strikeMode)pickWinMode=false; render(); }
function startPickWin(){ pickWinMode=true; strikeMode=false; hostFillMode=false; render(); }
function cancelPickWin(){ pickWinMode=false; render(); }
async function setResult(kind){ var b=board(); if(!b)return; if(kind==='none'&&!confirm('이 판의 결과 표시를 지울까요?'))return; await api('/api/result',{boardId:b.id,kind:kind}); pickWinMode=false; poll(); }
async function toggleCellStrike(cell){ var b=board(); if(!b)return; await api('/api/strikecell',{boardId:b.id,cell:cell}); poll(); }
async function toggleStrike(row){ var b=board(); if(!b)return; await api('/api/strike',{boardId:b.id,row:row}); poll(); }
async function onCellPlayer(cell){
  if(hostFillMode&&role==='host'&&!pickWinMode){ openFillPicker(cell); return; }
  if(strikeMode&&!pickWinMode){ var bs=board(); await api('/api/strikecell',{boardId:bs.id,cell:cell}); poll(); return; }
  if(pickWinMode){ var bb=board(); var owner=((ST.claims[bb.id]||{})[cell]); if(!owner){ alert('이름이 적힌 칸을 골라 주세요.'); return; }
    await api('/api/result',{boardId:bb.id,kind:'win',cell:cell}); pickWinMode=false; poll(); return; }if(!meIsCurrent()){alert('아직 당신 차례가 아닙니다.');return;}
  var r=await api('/api/claim',{boardId:board().id,cell:cell,playerId:myId});
  if(r&&r.error==='not_turn')alert('아직 당신 차례가 아닙니다.'); else if(r&&r.error==='taken')alert('이미 채워진 칸입니다.');
  poll();}

// ---------- host: table edit (inline) ----------
function renderTbar(){var t=$('tbar');if(editing){t.innerHTML='<div style="width:100%;background:#eef4ff;border:1px solid #c9d6f5;border-radius:10px;padding:11px 13px;font-size:13.5px;font-weight:700;color:#2b3a67;line-height:1.6">📝 <b>수정 모드</b> — 표 안 각 칸을 눌러 글자를 고치고, <b>＋행/−행·＋열/−열</b>로 칸을 늘리거나 줄이세요. 다 되면 <b>💾 저장</b>.</div><div class="row2" style="margin-top:8px"><button class="btn green small" onclick="saveEdit()">💾 저장</button><button class="btn ghost small" onclick="cancelEdit()">취소</button></div>';}else t.innerHTML='';}
function renderEdit(){var t=$('boardH');t.className='board edit';t.dataset.edit='1';var bb=board();if(bb){var th=theme(bb);t.style.setProperty('--tt',th.t);t.style.setProperty('--th',th.h);t.style.setProperty('--te',th.e);if(t.parentElement)t.parentElement.style.borderColor=th.e;}var c=draft;var AC=c.answerCols.length,total=2+AC+1;var h='';
  (c.title||[]).forEach(function(l,i){h+='<tr><td class="title" colspan="'+total+'"><div class="row2" style="justify-content:center"><input value="'+esc(l).replace(/"/g,'&quot;')+'" oninput="dTitle('+i+',this.value)" style="max-width:70%"><button class="mini del" onclick="dDelTitle('+i+')">− 제목</button></div></td></tr>';});
  h+='<tr><td class="title" colspan="'+total+'"><button class="mini add" onclick="dAddTitle()">＋ 제목 줄</button></td></tr>';
  h+='<tr><td class="head" colspan="2"><input value="'+esc(c.labelHeader||'').replace(/"/g,'&quot;')+'" oninput="dHead(this.value)"></td>';
  c.answerCols.forEach(function(a,i){h+='<td class="head"><input value="'+esc(a).replace(/"/g,'&quot;')+'" oninput="dCol('+i+',this.value)"><button class="mini del" onclick="dDelCol('+i+')">− 열</button></td>';});
  h+='<td class="head"><button class="mini add" onclick="dAddCol()">＋ 열</button></td></tr>';
  c.rows.forEach(function(row,ri){h+='<tr><td style="width:120px"><input placeholder="그룹(없으면 비움)" value="'+esc(row.group||'').replace(/"/g,'&quot;')+'" oninput="dGroup('+ri+',this.value)"></td>'+
    '<td><input placeholder="항목 이름" value="'+esc(row.label||'').replace(/"/g,'&quot;')+'" oninput="dLabel('+ri+',this.value)"></td>'+
    Array.apply(null,{length:AC}).map(function(){return '<td class="ph">빈칸</td>';}).join('')+'<td><button class="mini del" onclick="dDelRow('+ri+')">− 행</button></td></tr>';});
  h+='<tr><td colspan="'+total+'"><button class="mini add" onclick="dAddRow()">＋ 행 추가</button></td></tr>';
  t.innerHTML=h;$('tableHintH').textContent='';}
function dTitle(i,v){draft.title[i]=v;} function dAddTitle(){draft.title=draft.title||[];draft.title.push('');renderEdit();} function dDelTitle(i){draft.title.splice(i,1);renderEdit();}
function dHead(v){draft.labelHeader=v;}
function dCol(i,v){draft.answerCols[i]=v;} function dAddCol(){draft.answerCols.push('선택 '+(draft.answerCols.length+1));renderEdit();} function dDelCol(i){if(draft.answerCols.length>1){draft.answerCols.splice(i,1);renderEdit();}else alert('열은 최소 1개.');}
function dGroup(i,v){draft.rows[i].group=v;} function dLabel(i,v){draft.rows[i].label=v;}
function dAddRow(){draft.rows.push({group:'',label:''});renderEdit();} function dDelRow(i){if(draft.rows.length>1){draft.rows.splice(i,1);renderEdit();}else alert('행은 최소 1개.');}
function toggleEdit(){if(editing){cancelEdit();return;}var b=board();if(!b)return;draft=JSON.parse(JSON.stringify(b.config));editing=true;$('editToggle').textContent='✕ 수정 끝내기';$('boardH').dataset.edit='';renderTbar();renderEdit();try{window.scrollTo(0,0);}catch(e){}}
function cancelEdit(){editing=false;draft=null;$('boardH').dataset.edit='';$('editToggle').textContent='✏️ 표 수정하기';render();}
async function saveEdit(){if(!draft.answerCols.length||!draft.rows.length){alert('열과 행이 각각 1개 이상 필요합니다.');return;}var r=await apiH('/api/board',{action:'config',boardId:board().id,config:draft});if(r&&r.ok){editing=false;draft=null;$('editToggle').textContent='✏️ 표 수정하기';poll();}else alert('저장 실패');}

// ---------- host actions ----------
async function startGame(){if(!ST.players.length){alert('참가자가 있어야 시작할 수 있습니다.');return;}var b=board(); if(!b)return; await apiH('/api/turn',{boardId:b.id,action:'start'});poll();}
async function stopGame(){ var b=board(); if(!b)return; if(!confirm('「'+b.name+'」 판을 중단할까요?\n(이 판의 칸과 순서는 유지되고, 다른 판은 영향이 없습니다)'))return; await apiH('/api/turn',{boardId:b.id,action:'stop'}); poll(); }
async function passTurn(){var b=board(); if(!b)return; await apiH('/api/turn',{boardId:b.id,action:'pass'});poll();}
async function setPPT(){var b=board(); if(!b)return; await apiH('/api/turn',{boardId:b.id,patch:{picksPerTurn:+$('ppt').value||1}});poll();}
async function setCur(i){var b=board(); if(!b)return; await apiH('/api/turn',{boardId:b.id,patch:{curIdx:i}});poll();}
async function undo(){var b=board(); if(!b)return; await apiH('/api/undo',{boardId:b.id});poll();}
async function clearBoard(){if(!confirm('이 판의 채운 칸을 모두 지울까요?'))return;await apiH('/api/board',{action:'clear',boardId:board().id});poll();}
async function resetAll(){if(!confirm('모든 판의 채운 칸을 초기화할까요?'))return;await apiH('/api/reset',{});poll();}
async function movePlayer(i,d){var pl=ST.players.slice();var j=i+d;if(j<0||j>=pl.length)return;var tmp=pl[i];pl[i]=pl[j];pl[j]=tmp;await apiH('/api/players',{players:pl});poll();}
async function removePlayer(i){var p=ST.players[i]; if(!p)return;
  var n=0; ST.boards.forEach(function(b){var c=ST.claims[b.id]||{}; Object.keys(c).forEach(function(k){if(c[k]===p.id)n++;});});
  var msg='⚠ 「'+p.name+'」 님을 참가자에서 삭제할까요?'+(n?'\n\n이 참가자가 채운 '+n+'칸이 "?"로 바뀝니다.\n(삭제 후에도 아래 「삭제된 참가자 칸 복구」에서 다른 참가자에게 다시 배정할 수 있어요)':'');
  if(!confirm(msg))return;
  var pl=ST.players.slice();pl.splice(i,1);await apiH('/api/players',{players:pl});poll();}
function toggleHostFill(){ hostFillMode=!hostFillMode; if(hostFillMode)pickWinMode=false; render(); }
function closePicker(){ var m=$('pickMask'); if(m)m.remove(); }
function openFillPicker(cell){ var b=board(); if(!b)return; closePicker();
  var m=/^(\d+)_(\d+)$/.exec(cell); if(!m)return; var row=b.config.rows[+m[1]], col=b.config.answerCols[+m[2]]; if(!row)return;
  var owner=(ST.claims[b.id]||{})[cell]; var op=findPlayer(owner);
  var h='<div class="picksheet"><h3>칸 채우기</h3><div class="sub">'+esc((row.group?row.group+' · ':'')+row.label)+' / '+esc(col||'')+(owner?' — 현재: '+(op?esc(op.name):'삭제된 참가자(?)'):' — 현재: 빈칸')+'</div>';
  ST.players.forEach(function(p){ h+='<button class="popt'+(p.id===owner?' cur':'')+'" data-pid="'+esc(p.id)+'"><span class="dot" style="background:'+p.color+'"></span>'+esc(p.name)+(p.id===owner?' ✓':'')+'</button>'; });
  if(!ST.players.length) h+='<div class="note">먼저 아래 「참가자」에서 친구를 추가하세요.</div>';
  if(owner) h+='<button class="popt" data-pid="" style="color:#c0392b">🧹 이 칸 비우기</button>';
  h+='<button class="popt" data-cancel="1" style="justify-content:center;color:var(--muted)">취소</button></div>';
  var mask=document.createElement('div'); mask.className='pickmask'; mask.id='pickMask'; mask.innerHTML=h;
  mask.onclick=function(ev){ if(ev.target===mask)closePicker(); };
  document.body.appendChild(mask);
  var bs=mask.querySelectorAll('button.popt'); for(var i=0;i<bs.length;i++){(function(bt){ bt.onclick=async function(){
    if(bt.getAttribute('data-cancel')){closePicker();return;}
    var pid=bt.getAttribute('data-pid'); closePicker();
    var r=await apiH('/api/hostclaim',{boardId:b.id,cell:cell,playerId:pid}); if(r&&r.error&&r.error!=='pin')alert('저장 실패: '+r.error); poll(); }; })(bs[i]); } }
function orphanGroups(){ var m={}; ST.boards.forEach(function(b){var c=ST.claims[b.id]||{}; Object.keys(c).forEach(function(k){var id=c[k]; if(!findPlayer(id))m[id]=(m[id]||0)+1;});}); return m; }
function renderOrphans(){ var box=$('orphanBox'); if(!box)return; var g=orphanGroups(), ids=Object.keys(g);
  if(!ids.length){ box.innerHTML=''; box.dataset.sig=''; return; }
  var sig=JSON.stringify([g,ST.players.map(function(p){return p.id+p.name;})]); if(box.dataset.sig===sig) return; box.dataset.sig=sig; // 변화 없으면 다시 그리지 않음(선택 유지)
  var total=0; ids.forEach(function(id){total+=g[id];});
  var opts=ST.players.map(function(p){return '<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>';}).join('');
  var h='<div class="orphanbox">⚠ 삭제된 참가자의 칸이 <b>'+total+'칸</b> 남아 있습니다 (표에 <b>?</b>로 표시).<br><span style="font-weight:500;font-size:12.5px">친구를 다시 추가한 뒤, 아래에서 그 사람에게 한꺼번에 배정하세요. 칸 하나씩은 「🖊 방장 칸 채우기」로 바꿀 수 있어요.</span>';
  ids.forEach(function(id,k){ h+='<div class="orow"><span>삭제된 참가자 '+(k+1)+' · '+g[id]+'칸 →</span>'+(ST.players.length?('<select id="orph'+k+'" data-from="'+esc(id)+'">'+opts+'</select><button class="btn small" onclick="reassignOrphan('+k+')">이 사람으로 배정</button>'):'<span class="note" style="margin:0">먼저 참가자를 추가하세요</span>')+'</div>'; });
  box.innerHTML=h+'</div>'; }
async function reassignOrphan(k){ var sl=$('orph'+k); if(!sl)return; var from=sl.getAttribute('data-from'), to=sl.value; var p=findPlayer(to); if(!p)return;
  if(!confirm('삭제된 참가자의 칸을 모두 「'+p.name+'」 님으로 배정할까요?'))return;
  var r=await apiH('/api/reassign',{fromId:from,toId:to}); if(r&&r.error&&r.error!=='pin')alert('실패: '+r.error); poll(); }
async function hostAddPlayer(){var v=($('addP').value||'').trim();if(!v)return;var pl=ST.players.slice();pl.push({name:v.slice(0,16)});$('addP').value='';await apiH('/api/players',{players:pl});poll();}
async function addBoard(){var n=prompt('새 게임판 이름','경기 '+(ST.boards.length+1));if(n===null)return;var r=await apiH('/api/board',{action:'add',name:n||('경기 '+(ST.boards.length+1))});if(r&&r.id){sel=r.id;localStorage.setItem('fb_sel',sel);editing=false;}await poll();toggleEdit();}
async function duplicateBoard(){var b=board();var n=prompt('복제한 판의 이름','('+b.name+') 복사');if(n===null)return;var r=await apiH('/api/board',{action:'duplicate',boardId:b.id,name:n||(b.name+' 복사')});if(r&&r.id){sel=r.id;localStorage.setItem('fb_sel',sel);editing=false;}await poll();toggleEdit();}
async function moveBoard(idx,d){await apiH('/api/board',{action:'move',boardId:ST.boards[idx].id,dir:d});poll();}
async function renameBoard(){var b=board();var n=prompt('게임판 이름',b.name);if(n===null)return;await apiH('/api/board',{action:'rename',boardId:b.id,name:n||b.name});poll();}
async function deleteBoard(){var b=board();if(ST.boards.length<=1){alert('마지막 판은 삭제할 수 없습니다.');return;}if(!confirm('"'+b.name+'" 삭제?'))return;await apiH('/api/board',{action:'delete',boardId:b.id});sel='';editing=false;$('editToggle').textContent='✏️ 표 수정하기';poll();}

// ---------- role/view ----------
function goHost(){role='host';localStorage.setItem('fb_role','host');render();}
function exitHost(){role='player';localStorage.setItem('fb_role','player');render();}
function checkPin(){var v=($('pinInput').value||'').trim();api('/api/admin/check',{pin:v}).then(function(r){if(r.ok){localStorage.setItem('fb_pin',v);$('pinErr').textContent='';enterHost();}else $('pinErr').textContent='PIN 오류';});}
function enterHost(){var ok=!!hpin();$('pinGate').classList.toggle('hidden',ok);$('hostMain').classList.toggle('hidden',!ok);if(ok)renderHost();}
function changePin(){var np=($('newPin').value||'').trim();if(np.length<4){$('pinMsg').textContent='4자리 이상';return;}apiH('/api/admin/pin',{newPin:np}).then(function(r){if(r.ok){localStorage.setItem('fb_pin',np);$('pinMsg').textContent='변경됨 ✓';$('newPin').value='';}else $('pinMsg').textContent='실패';});}
function renderQR(){var url=location.origin;var L=$('linkline');if(L)L.textContent=url;var box=$('qr');if(box&&!box.dataset.done){try{if(window.QRCode){new QRCode(box,{text:url,width:130,height:130,correctLevel:QRCode.CorrectLevel.M});box.dataset.done='1';}}catch(e){}}}

function render(){
  var cb=$('connbar'); if(cb){ cb.innerHTML= connErr ? '<div style="background:#fdeaea;border:1px solid #e0999955;color:#b13636;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:13px;font-weight:700">⚠ 서버 연결 문제: '+esc(connErr)+' — 잠시 후 자동 재시도합니다. (방장 화면에서 표를 먼저 만들었는지, 새로고침도 확인)</div>' : ''; }
  if(ST.boards.length && !ST.boards.find(function(b){return b.id===sel;}))sel=ST.boards[0].id;
  $('nameGate').classList.toggle('hidden',!(role==='player'&&!myName));
  $('play').classList.toggle('hidden',!(role==='player'&&myName));
  $('host').classList.toggle('hidden',role!=='host');
  $('topRight').innerHTML = role==='host' ? '' : (myName?('<span class="whoami"><span class="dot" style="width:11px;height:11px;border-radius:50%;background:'+((findPlayer(myId)||{}).color||'#4ADE80')+'"></span>'+esc(myName)+'</span> <button class="btn ghost small" onclick="enableNotify()">'+(notifyOn?'🔔 알림 켜짐':'🔔 알림 켜기')+'</button>'):'');
  if(role==='player'&&myName){ renderTabs('tabs',false); paintTurn('turnbar','prog',true); renderBoardInto('board','tableHint',true); renderPlayers('players',false); renderResult('resultBox'); var nr=$('notifyRow'); if(nr) nr.innerHTML = (notifyOn||pushOn) ? '' : '<button class="btn small" onclick="enableNotify()">🔔 내 차례 알림 켜기</button> <span class="note" style="margin:0">차례가 오면 소리·진동으로 알려드려요</span>'; }
  else if(role==='host'){ enterHost(); }
  checkTurnAlert();
}
function renderHost(){ renderTabs('tabsH',true); paintTurn('turnbarH','progH',false); renderPlayers('playersH',true); renderOrphans(); renderResult('resultBoxH');
  var fb=$('fillBtn'); if(fb){ fb.textContent=hostFillMode?'✅ 칸 채우기 끝내기':'🖊 방장 칸 채우기'; fb.className='btn small '+(hostFillMode?'green':'ghost'); }
  var fbar=$('fillBar'); if(fbar) fbar.innerHTML=hostFillMode?'<div class="hostfillbar">🖊 <b>방장 칸 채우기 모드</b> — 표의 칸을 누르면 참가자를 골라 채우거나(차례와 상관없이, 이미 채운 칸도 변경) 비울 수 있어요.</div>':'';
  if(editing){ if(!$('boardH').dataset.edit){ renderEdit(); $('boardH').dataset.edit='1'; } } else { $('boardH').dataset.edit=''; renderBoardInto('boardH','tableHintH',false); }
  var b=board(); var _t=bturn(); var _bn=b?b.name:'';
  $('startBtn').textContent=_t.started?('▶ 「'+_bn+'」 다시 시작'):('▶ 「'+_bn+'」 시작');
  var sb=$('stopBtn'); if(sb){ sb.disabled=!_t.started; sb.textContent=_t.started?'⏸ 이 판 중단':'⏸ 중단됨'; }
  if(document.activeElement!==$('ppt'))$('ppt').value=_t.picksPerTurn||1; renderTbar(); renderQR(); }

Object.assign(window,{toggleHostFill:toggleHostFill,reassignOrphan:reassignOrphan,toggleCellStrike:toggleCellStrike,toggleStrikeMode:toggleStrikeMode,stopGame:stopGame,startPickWin:startPickWin,cancelPickWin:cancelPickWin,setResult:setResult,toggleStrike:toggleStrike,enableNotify:enableNotify,join:join,changeName:changeName,goHost:goHost,exitHost:exitHost,checkPin:checkPin,changePin:changePin,toggleEdit:toggleEdit,cancelEdit:cancelEdit,saveEdit:saveEdit,dTitle:dTitle,dAddTitle:dAddTitle,dDelTitle:dDelTitle,dHead:dHead,dCol:dCol,dAddCol:dAddCol,dDelCol:dDelCol,dGroup:dGroup,dLabel:dLabel,dAddRow:dAddRow,dDelRow:dDelRow,startGame:startGame,passTurn:passTurn,setPPT:setPPT,setCur:setCur,undo:undo,clearBoard:clearBoard,resetAll:resetAll,movePlayer:movePlayer,removePlayer:removePlayer,hostAddPlayer:hostAddPlayer,addBoard:addBoard,duplicateBoard:duplicateBoard,moveBoard:moveBoard,renameBoard:renameBoard,deleteBoard:deleteBoard,onCellPlayer:onCellPlayer});


var notifyOn=false, pushOn=false, wasMyTurn=false, lastTurnKey='';
function urlB64ToUint8(base64){var pad='='.repeat((4-base64.length%4)%4);var b64=(base64+pad).replace(/-/g,'+').replace(/_/g,'/');var raw=atob(b64);var arr=new Uint8Array(raw.length);for(var i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);return arr;}
async function subscribePush(silent){
  try{
    if(!('serviceWorker' in navigator) || !('PushManager' in window)) return false;
    var reg=await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    var vr=await (await fetch('/api/vapid')).json();
    if(!vr || !vr.key) return false;
    var sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:urlB64ToUint8(vr.key)});
    await fetch('/api/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({playerId:myId, sub:sub})});
    pushOn=true; return true;
  }catch(e){ if(!silent)console.log('push sub err',e); return false; }
}
async function enableNotify(){
  try{
    if(!('Notification' in window)){ alert('이 브라우저는 웹 알림을 지원하지 않습니다.\n아이폰은 먼저 「홈 화면에 추가」로 앱을 설치한 뒤 그 앱에서 켜주세요.'); return; }
    var perm=await Notification.requestPermission();
    notifyOn=(perm==='granted');
    if(!notifyOn){ try{render();}catch(e){} alert('알림 권한이 꺼져 있어요.\n폰 설정 > 이 사이트(또는 홈 화면 앱)의 알림을 허용해 주세요.'); return; }
    var ok=await subscribePush(false);
    try{render();}catch(e){}
    try{ new Notification(ok?'✅ 내 차례 알림이 켜졌습니다':'알림이 켜졌습니다', {body: ok?'폰이 잠겨 있어도 내 차례가 되면 알려드려요!':'내 차례가 되면 알려드릴게요!', icon:'icon-192.png'}); }catch(e){}
    if(!ok) alert('알림은 켜졌지만 백그라운드 푸시 등록에 실패했어요.\n앱을 홈 화면에 추가한 상태에서 다시 시도하면 폰이 잠겨 있어도 알림이 옵니다.');
  }catch(e){}
}
function beep(){
  try{ var Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx)return; var ac=beep._ac||(beep._ac=new Ctx());
    if(ac.state==='suspended')ac.resume();
    [0,0.18].forEach(function(off){ var o=ac.createOscillator(),g=ac.createGain(); o.type='sine'; o.frequency.value=880;
      o.connect(g); g.connect(ac.destination); var t=ac.currentTime+off; g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.25,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.16); o.start(t); o.stop(t+0.17); });
  }catch(e){}
}
function fireMyTurnAlert(){
  try{ if(navigator.vibrate) navigator.vibrate([200,90,200]); }catch(e){}
  beep();
  try{ if(notifyOn && document.hidden){ var n=new Notification('🟢 내 차례예요!', {body:'지금 빈칸을 채울 차례입니다.', icon:'icon-192.png', tag:'myturn', renotify:true}); n.onclick=function(){ window.focus(); n.close(); }; } }catch(e){}
  try{ document.title='🟢 내 차례! · 친구와의 즐거운 내기 한판'; }catch(e){}
}
function checkTurnAlert(){
  if(role!=='player' || !myName){ wasMyTurn=false; return; }
  var mine = meIsCurrent();
  var _t=bturn(); var key=(board()?board().id:'')+':'+(_t.started?'1':'0')+':'+_t.curIdx+':'+((curPlayer()||{}).id||'');
  if(mine && (!wasMyTurn || key!==lastTurnKey)){ fireMyTurnAlert(); }
  if(!mine){ try{ if(document.title.indexOf('내 차례')>=0) document.title='친구와의 즐거운 내기 한판'; }catch(e){} }
  wasMyTurn=mine; lastTurnKey=key;
}

async function poll(){var st=await api('/api/state');if(st&&st.boards){connErr='';if(!st.turn)st.turn={curIdx:0,remaining:1,picksPerTurn:1,started:false};if(!st.claims)st.claims={};if(!st.strikes)st.strikes={};if(!st.cellStrikes)st.cellStrikes={};if(!st.results)st.results={};if(!Array.isArray(st.players))st.players=[];ST=st;}else{connErr=(st&&st.error)?st.error:'응답 없음';}render();}
try{ if(('Notification' in window)&&Notification.permission==='granted'){ notifyOn=true; subscribePush(true); } }catch(e){}
render();(async function(){await poll();setInterval(poll,1500);})();
</script>
